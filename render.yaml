databases:
  - name: resumeai-staging-db
    databaseName: resumeai
    user: resumeai
    plan: free

services:
  - type: web
    name: resumeai-staging
    runtime: node
    rootDir: web
    plan: free
    numInstances: 1
    buildCommand: pnpm install --frozen-lockfile --prod=false && pnpm db:generate:prod && pnpm build
    startCommand: pnpm db:push:prod && pnpm db:seed && pnpm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_ENV
        value: staging
      - key: REGISTRATION_MODE
        value: invite_only
      - key: DATABASE_URL
        fromDatabase:
          name: resumeai-staging-db
          property: connectionString
      - key: SESSION_SECRET
        sync: false
      - key: LLM_PROVIDER
        value: deepseek
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: DEEPSEEK_BASE_URL
        value: https://api.deepseek.com
      - key: DEEPSEEK_MODEL
        value: deepseek-chat
      - key: LLM_RATE_LIMIT_PER_MINUTE
        value: "10"
      - key: MAX_TEXT_BYTES
        value: "20000"
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
